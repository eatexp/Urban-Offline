name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Run Lint
      run: pnpm lint || true
      # || true because linting might fail on legacy code, but we want to see output
      # Ideally should be strict, but for now we relax it.

    - name: Run Tests
      run: pnpm test run

    - name: Build
      run: pnpm build
